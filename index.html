<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <header>
    <strong>JARVIS</strong>
    <span id="status">● ONLINE</span>
  </header>

  <section class="hero">

    <div class="orb">
      <div class="core"></div>
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
    </div>

    <h1>Olá, senhor.</h1>

    <p id="message">
      Estou pronto para receber seu comando.
    </p>

  </section>

  <section class="buttons">

    <button id="lightOn">
      💡 Ligar luz
    </button>

    <button id="lightOff">
      ◐ Desligar luz
    </button>

  </section>

  <button class="mic" id="mic">
    🎙
  </button>

  <small>JARVIS • INTERFACE WEB</small>

</main>

<script src="script.js"></script>

</body>
</html>
