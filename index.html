<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="jarvis">

        <div class="orb">
            <div class="orb-inner"></div>
        </div>

        <h1>JARVIS</h1>

        <p class="subtitle">Olá, senhor.</p>

        <div id="message" class="message">
            Sistema pronto.
        </div>

        <section class="controls">

            <button id="lightOn" class="control-button">
                <span class="icon">💡</span>

                <span>
                    <strong>Ligar luz</strong>
                    <small>Luz da mesa</small>
                </span>
            </button>

            <button id="lightOff" class="control-button">
                <span class="icon">🌙</span>

                <span>
                    <strong>Desligar luz</strong>
                    <small>Luz da mesa</small>
                </span>
            </button>

        </section>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">JARVIS ONLINE</span>
        </div>

    </main>

    <script src="script.js?v=4"></script>

</body>
</html>
